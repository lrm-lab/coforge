name: Publish Computer (production)
run-name: Publish Computer ${{ inputs.version }} from ${{ inputs.commit }} to production${{ inputs.staging_version && format(' (staging {0})', inputs.staging_version) || '' }}${{ inputs.without_staging && ' without staging' || '' }}

# Production promotion of the local Computer distribution (docs/release/staging-to-production.md).
# The feed a build trusts is compiled into it, so production never copies staging's binaries: it
# builds the approved commit again against https://releases.coforge.cn. The `candidate` job checks
# that staging published staging_version from this commit and that version follows the version rule
# (docs/release/github-actions.md); the run title names version because a run-name expression cannot
# strip -dev.N. Staging publishes only from `main` and only after the release gates. The
# `production` GitHub Environment carries the required human reviewer, who approves this exact
# commit and version.
# Publish the production installer (release-installer-production.yml) first: install.sh reads
# `installer/latest` from the same feed.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full source commit that staging published this version from (40 hex)
        required: true
        type: string
      version:
        description: Stable production version, staging_version without its -dev.N suffix (e.g. 0.1.5)
        required: true
        type: string
      staging_version:
        description: >-
          Staging dev build this release promotes, which staging's latest names (e.g. 0.1.5-dev.3);
          required unless without_staging
        required: false
        type: string
      without_staging:
        description: >-
          Skip the staging comparison: check the commit and version for shape, and the version against
          production's latest, only. For a release approved without a staging publication.
        required: false
        type: boolean
        default: false
      notes_en:
        description: >-
          Release notes in English (Markdown, at most 16000 characters), written for users; usually
          the staging candidate's notes (docs/release/release-notes.md).
        required: true
        type: string
      notes_zh_cn:
        description: Release notes in Simplified Chinese (Markdown, at most 16000 characters).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify the staging-published candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # The workflow's own commit (`main`), with history: the verifier is this run's, and the
      # candidate commit is checked against `main` without being checked out.
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          cache: false
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol sources
        run: bun run --cwd packages/coforge-sdk generate

      # The inputs are caller-controlled text: they reach the scripts only through env vars, and the
      # scripts validate them before they name any object. Checked here, the notes fail before the
      # approval gate rather than after the build.
      - name: Require both languages of release notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_NOTES_EN: ${{ inputs.notes_en }}
          RELEASE_NOTES_ZH_CN: ${{ inputs.notes_zh_cn }}
        run: bun scripts/release/release-notes.ts --check --version "$INPUT_VERSION"

      - name: Require the version staging published from this commit
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_STAGING_VERSION: ${{ inputs.staging_version }}
          WITHOUT_STAGING: ${{ inputs.without_staging }}
        run: |
          flags=()
          if [ "$WITHOUT_STAGING" = true ]; then flags=(--without-staging); fi
          if [ -n "$INPUT_STAGING_VERSION" ]; then flags+=("--staging-version=$INPUT_STAGING_VERSION"); fi
          # Production's feed is public: its latest is read anonymously.
          bun scripts/release/production-candidate.ts "${flags[@]}" \
            --production-feed-url=https://releases.coforge.cn computer \
            "$INPUT_VERSION" "$INPUT_COMMIT" https://releases-staging.coforge.cn
          # Validated above as 40 hex characters, so it cannot be read as an option.
          git merge-base --is-ancestor "$INPUT_COMMIT" HEAD
          echo "- Candidate: Computer ${INPUT_VERSION} from ${INPUT_COMMIT}, staging evidence ${INPUT_STAGING_VERSION:-none}, on main" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish Computer
    needs: candidate
    # macOS, for Apple's codesign.
    runs-on: macos-latest
    environment: production
    # `id-token: write` lets this job mint the GitHub OIDC token it exchanges for the Alibaba Cloud
    # STS credential of the production publisher role, whose trust policy names only this
    # repository's `production` environment.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          cache: false
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol sources
        run: bun run --cwd packages/coforge-sdk generate

      - name: Request an OIDC token for Alibaba Cloud
        env:
          AUDIENCE: sts.aliyuncs.com
        run: |
          token_file="$RUNNER_TEMP/aliyun-oidc-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            | jq -r '.value' > "$token_file"
          chmod 600 "$token_file"
          echo "ALIBABA_CLOUD_OIDC_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          # The RAM role's trust policy matches these three claims exactly; print them so a
          # trust-policy mismatch is diagnosable from the run log. The payload is public run
          # metadata; the signature (the only secret part) is never printed.
          payload="$(cut -d. -f2 "$token_file" | tr '_-' '/+' | awk '{ n = length($0) % 4; if (n) $0 = $0 substr("==", 1, 4 - n); print }' | base64 -d)"
          printf 'OIDC claims: %s\n' "$(printf '%s' "$payload" | jq -c '{iss, aud, sub, exp}')"

      - name: Build six platforms, upload, and verify release
        env:
          ALIBABA_CLOUD_ROLE_ARN: acs:ram::1085194890307801:role/coforge-release-publisher-production
          ALIBABA_CLOUD_OIDC_PROVIDER_ARN: acs:ram::1085194890307801:oidc-provider/github-actions
          ALIBABA_CLOUD_ROLE_SESSION_NAME: github-actions-${{ github.run_id }}
          ALIBABA_CLOUD_ECS_METADATA_DISABLED: "true"
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
          # Signs the darwin executables (scripts/release/darwin-signing.ts); no other step holds it.
          COFORGE_DARWIN_SIGNING_KEY: ${{ secrets.COFORGE_DARWIN_SIGNING_KEY }}
        # Transfer acceleration, as staging: the endpoint is global, so the bucket's region is
        # passed for V4 signing.
        run: |
          bun scripts/release/publish.ts \
            --version "$INPUT_VERSION" \
            --commit "$INPUT_COMMIT" \
            --feed-url "https://releases.coforge.cn" \
            --bucket coforge-releases \
            --endpoint oss-accelerate.aliyuncs.com \
            --region oss-cn-beijing

      - name: Summarize published release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          {
            echo "## Computer published to production"
            echo ""
            echo "- Version: ${INPUT_VERSION}"
            echo "- Source commit: ${INPUT_COMMIT}"
            echo "- Feed: https://releases.coforge.cn"
            echo "- Platforms: Linux, macOS, Windows (x64 and arm64)"
            echo "- macOS executables: signed with the Computer's code-signing certificate; designated requirement verified"
            echo "- Verified: uploaded bytes, checksums, private storage access, and latest version selector"
            echo "- CDN delivery and complete install/upgrade/rollback acceptance are separate checks."
          } >> "$GITHUB_STEP_SUMMARY"

  # Registered once `latest` has moved, by the reusable notes workflow: it changes notes text, never
  # artifacts, so it holds the catalog token without the approval gate's environment or the
  # publisher role, and it runs main's script, not the approved commit's, which may predate it.
  # `gh run rerun --failed` repeats only this job if the catalog was unreachable.
  notes:
    name: Register release notes
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-notes.yml
    with:
      environment: production
      version: ${{ inputs.version }}
      notes_en: ${{ inputs.notes_en }}
      notes_zh_cn: ${{ inputs.notes_zh_cn }}
    secrets:
      COFORGE_RELEASE_CATALOG_TOKEN_PRODUCTION: ${{ secrets.COFORGE_RELEASE_CATALOG_TOKEN_PRODUCTION }}
