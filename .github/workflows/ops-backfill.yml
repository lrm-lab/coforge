name: Run Web data backfill

# Unified operator workflow for re-runnable Web data backfills bundled into the deployed image
# under /app/.ops/backfill-<script>.js (apps/web/Dockerfile). Runs inside the live Web container
# over SSH using the chosen GitHub Environment's secrets.
#
# Every free-text input is validated by apps/web/scripts/validate-backfill-inputs.sh and quoted
# with `printf %q` before reaching the remote shell.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Backfill script to run"
        required: true
        type: choice
        options:
          - artifact-origins
          - message-references
          - owner-agent-names
      environment:
        description: "Where to run"
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: "dry-run reports only; apply writes; rollback (message-references only) deletes that run's rows"
        required: true
        type: choice
        options:
          - dry-run
          - apply
          - rollback
      confirm:
        description: "To apply in production: apply-production. To roll back: rollback-production"
        required: false
        type: string
      fromMessageId:
        description: "Resume from this Message.id (uuid7; artifact-origins, message-references)"
        required: false
        type: string
      scanWindow:
        description: "Message ids scanned per window (artifact-origins)"
        required: false
        type: string
        default: "5000"
      batchSize:
        description: "Messages per batch (artifact-origins, message-references)"
        required: false
        type: string
        default: "500"
      maxMinutes:
        description: "Stop after this many minutes and print the resume cursor (artifact-origins, message-references)"
        required: false
        type: string
        default: "12"
      pauseMs:
        description: "Pause between batches, milliseconds (artifact-origins, message-references)"
        required: false
        type: string
        default: "100"
      runId:
        description: "rollback: the apply run's id (message-references)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ops-backfill-${{ inputs.script }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Run ${{ inputs.script }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Reject unsupported mode for the selected script
        if: inputs.mode == 'rollback' && inputs.script != 'message-references'
        run: |
          echo "rollback mode is only supported for message-references." >&2
          exit 1

      - name: Require the confirmation phrase for a production write
        if: inputs.environment == 'production' && inputs.mode != 'dry-run'
        env:
          CONFIRM: ${{ inputs.confirm }}
          MODE: ${{ inputs.mode }}
        run: |
          want=$([ "$MODE" = apply ] && echo apply-production || echo rollback-production)
          if [ "$CONFIRM" != "$want" ]; then
            echo "A production $MODE must set confirm to '$want'." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate inputs
        if: inputs.script != 'owner-agent-names'
        env:
          FROM_ID: ${{ inputs.fromMessageId }}
          SCAN_WINDOW: ${{ inputs.script == 'artifact-origins' && inputs.scanWindow || '' }}
          BATCH_SIZE: ${{ inputs.batchSize }}
          MAX_MINUTES: ${{ inputs.maxMinutes }}
          PAUSE_MS: ${{ inputs.pauseMs }}
          RUN_ID: ${{ inputs.runId }}
          MODE: ${{ inputs.mode }}
        run: bash apps/web/scripts/validate-backfill-inputs.sh

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Resolve the Web container
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          PROJECT: coforge-${{ inputs.environment }}
        run: |
          remote() {
            ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "$@"
          }
          ids="$(remote "docker ps -q --filter label=com.docker.compose.project=$PROJECT \
            --filter label=com.docker.compose.service=web --filter status=running")"
          container="$(printf '%s\n' "$ids" | head -n 1)"
          if [ -z "$container" ]; then
            echo "No running Web container for $PROJECT" >&2
            exit 1
          fi
          echo "WEB_CONTAINER=$container" >> "$GITHUB_ENV"

      - name: Back up agents.displayName before an apply
        if: inputs.script == 'owner-agent-names' && inputs.mode == 'apply'
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker exec -i -w /app '$WEB_CONTAINER' bun /app/.ops/backfill-owner-agent-names.js --backup" \
            > agents-displayName-backup.jsonl
          wc -l agents-displayName-backup.jsonl

      - name: Upload the backup
        if: inputs.script == 'owner-agent-names' && inputs.mode == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agents-displayName-backup-${{ inputs.environment }}
          path: agents-displayName-backup.jsonl
          retention-days: 90

      - name: Run the backfill
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          SCRIPT: ${{ inputs.script }}
          MODE: ${{ inputs.mode }}
          FROM_ID: ${{ inputs.fromMessageId }}
          SCAN_WINDOW: ${{ inputs.scanWindow }}
          BATCH_SIZE: ${{ inputs.batchSize }}
          MAX_MINUTES: ${{ inputs.maxMinutes }}
          PAUSE_MS: ${{ inputs.pauseMs }}
          RUN_ID: ${{ inputs.runId }}
        run: |
          args=""
          case "$MODE" in
            dry-run)  args="$args --dry-run";;
            apply)    args="$args --apply";;
            rollback) args="$args --rollback --run-id $(printf %q "$RUN_ID")";;
          esac
          if [ "$SCRIPT" != "owner-agent-names" ]; then
            [ -n "$FROM_ID" ] && args="$args --from-message-id $(printf %q "$FROM_ID")"
            [ "$SCRIPT" = "artifact-origins" ] && [ -n "$SCAN_WINDOW" ] && args="$args --scan-window $(printf %q "$SCAN_WINDOW")"
            [ -n "$BATCH_SIZE" ] && args="$args --batch-size $(printf %q "$BATCH_SIZE")"
            [ -n "$MAX_MINUTES" ] && args="$args --max-minutes $(printf %q "$MAX_MINUTES")"
            [ -n "$PAUSE_MS" ] && args="$args --pause-ms $(printf %q "$PAUSE_MS")"
          fi
          ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker exec -i -w /app '$WEB_CONTAINER' bun /app/.ops/backfill-$SCRIPT.js $args"
