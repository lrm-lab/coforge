name: installer build

# Called by release-installer-production.yml: the matrix compile is its own workflow so the
# release file stays under the size ratchet. It holds no OIDC token and no environment; it
# checks out the approved commit and hands each target's binary on as an artifact.

on:
  workflow_call:
    inputs:
      commit:
        description: The approved commit to compile the installer from.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.release_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple's linker ad-hoc signs arm64 output itself; macOS 27 kills arm64 binaries whose
          # signature is invalid, so the job verifies it with `codesign --verify --strict`.
          - release_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-latest
            mise_sha256: ed2ea8c994d98d0bfdc214d19c7351fb5bb506164dc368840bd09992d1bd07c5
            tools: rust
          # Cross-compiled on the arm64 runner. The linker leaves x86_64 output unsigned, so the
          # job ad-hoc signs it the way Bun signs its darwin-x64 executables.
          - release_target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-latest
            mise_sha256: ed2ea8c994d98d0bfdc214d19c7351fb5bb506164dc368840bd09992d1bd07c5
            tools: rust
          # musl, statically linked: no glibc version floor on the user's machine. This entry
          # also generates the licence notices, which every target's release ships beside it.
          - release_target: linux-x64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            mise_sha256: 2950f8e1c59f3d9716bc3ee7d9242de94f9ab4054d97e65e12f2e67867c5f8fd
            tools: rust github:EmbarkStudios/cargo-about
          - release_target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            mise_sha256: 2cea9423c16afa5e1f90646c35ebb3bc8d4647671a605d5856eb96dbbbf87e47
            tools: rust
          - release_target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-latest
            mise_sha256: 8a03fe2f169a215acbff3311098c89fb13f170a606b41c27e507467cde62e683
            mise_shim_sha256: 0097193b65bfc082e3fd8bde911a60ad4fc81536d66649ed3b305642c755a62d
            tools: rust
          - release_target: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            mise_sha256: 8f2ac6fb63035d46465fdb8e962f5c02120e2ba1004c46aad7763fdc68c267c8
            mise_shim_sha256: f0eb02a137b672c6518b78f9f9c277e93c29363f6942a9ffab143fa6a046a12f
            tools: rust
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/installer
    env:
      # From the repository root; the crate's own steps run one level down (`../../$BINARY`).
      BINARY: target/${{ matrix.rust_target }}/release/coforge-installer${{ startsWith(matrix.release_target, 'windows') && '.exe' || '' }}
      # `mise exec` would otherwise install every tool in crates/installer/mise.toml (and the root
      # one) that is missing, including supply-chain tools only linux-x64 uses; cargo-audit
      # publishes no windows-arm64 build. Each entry uses exactly its `tools`.
      # https://mise.jdx.dev/configuration/settings.html#exec_auto_install
      MISE_EXEC_AUTO_INSTALL: "false"
      # The feed the installer binary will trust once the crate compiles it in, one build per
      # environment (docs/release/tracks-and-identities.md); this is the production one.
      COFORGE_RELEASE_FEED_URL: https://releases.coforge.cn

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Resolve the mise binary cache path
        id: mise-bin-path
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            dir="$(cygpath -m "$LOCALAPPDATA/mise/bin")"
          else
            dir="$HOME/.local/share/mise/bin"
          fi
          {
            echo "path=$dir"
            # The cache holds binary files only: a directory entry could
            # carry an unverified executable that bin/'s PATH entry would run.
            echo "cache_paths<<__MISE_CACHE_PATHS__"
            if [ "$RUNNER_OS" = "Windows" ]; then
              printf '%s\n' "$dir/mise.exe" "$dir/mise-shim.exe"
            else
              printf '%s\n' "$dir/mise"
            fi
            echo "__MISE_CACHE_PATHS__"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the mise binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.mise-bin-path.outputs.cache_paths }}
          key: mise-bin-2026.9.2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.mise_sha256 }}

      # mise-action runs a restored binary before its own sha256 check, so a
      # poisoned cache must be rejected here, before setup executes it.
      - name: Verify the restored mise binaries
        shell: bash
        run: |
          set -euo pipefail
          bindir="${{ steps.mise-bin-path.outputs.path }}"
          for entry in "$bindir"/*; do
            [ -e "$entry" ] || continue
            case "$(basename "$entry")" in
              mise|mise.exe|mise-shim.exe) ;;
              *) echo "unexpected entry in restored mise bin: $entry" >&2; exit 1 ;;
            esac
          done
          for f in "$bindir/mise" "$bindir/mise.exe" "$bindir/mise-shim.exe"; do
            [ -f "$f" ] || continue
            case "$f" in
              *mise-shim.exe) want="${{ matrix.mise_shim_sha256 }}" ;;
              *) want="${{ matrix.mise_sha256 }}" ;;
            esac
            got="$(sha256sum "$f" 2>/dev/null || shasum -a 256 "$f")"
            [ "${got%% *}" = "$want" ] || {
              echo "restored $(basename "$f") sha256 mismatch" >&2
              exit 1
            }
          done

      # From crates/installer/ mise also sees the root tools, so install only what this entry uses.
      - name: Install pinned Rust tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          cache: false
          sha256: ${{ matrix.mise_sha256 }}
          working_directory: crates/installer
          install_args: ${{ matrix.tools }}

      # sha256 above covers mise.exe only; the archive's second binary needs its own check.
      - name: Verify the mise shim
        if: startsWith(matrix.release_target, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          shim="$(cygpath -u "$LOCALAPPDATA")/mise/bin/mise-shim.exe"
          if [ ! -f "$shim" ]; then
            echo "mise-shim.exe is absent; mise falls back to file shim mode"
            exit 0
          fi
          got="$(sha256sum "$shim" | cut -d' ' -f1)"
          want="${{ matrix.mise_shim_sha256 }}"
          if [ "$got" != "$want" ]; then
            echo "mise-shim.exe sha256 mismatch: expected $want, got $got" >&2
            exit 1
          fi

      - name: Add the Rust target
        run: mise exec rust -- rustup target add "${{ matrix.rust_target }}"

      - name: Install the musl C compiler for ring
        if: startsWith(matrix.release_target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          target="${{ matrix.rust_target }}"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: mise exec rust -- cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Ad-hoc sign the x86_64 darwin binary
        if: matrix.release_target == 'darwin-x64'
        run: codesign --sign - --force "../../$BINARY"

      - name: Verify the darwin signature
        if: startsWith(matrix.release_target, 'darwin')
        run: |
          codesign -dv --verbose=2 "../../$BINARY"
          codesign --verify --strict --verbose=2 "../../$BINARY"

      - name: Report binary size
        run: |
          size="$(wc -c < "../../$BINARY" | tr -d ' ')"
          echo "coforge-installer ${{ matrix.release_target }}: $size bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Run on the native host
        if: matrix.release_target != 'darwin-x64'
        run: '"../../$BINARY" --version'

      - name: Run under Rosetta when available
        if: matrix.release_target == 'darwin-x64'
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "../../$BINARY" --version
          else
            echo "::warning::Rosetta is not installed on this runner; darwin-x64 was built but not run"
          fi

      - name: Generate third-party notices
        if: matrix.release_target == 'linux-x64'
        run: mise exec -- cargo about generate --locked --fail --output-file THIRD_PARTY_NOTICES.txt about/notices.hbs

      # The artifact holds this target's binary and nothing else, plus the notices from the one job
      # that has them; `publish-installer.ts finalize` refuses any other file in it.
      - name: Stage this target's output
        working-directory: .
        env:
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          mkdir installer-out
          cp "$BINARY" installer-out/
          if [ "$RELEASE_TARGET" = linux-x64 ]; then
            cp crates/installer/THIRD_PARTY_NOTICES.txt installer-out/
          fi

      - name: Hand this target's output to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.release_target }}
          path: installer-out
          if-no-files-found: error
          retention-days: 7
