name: Deploy Web (production)

# The release coordinator verifies same-commit CI, Web integration, and a
# staging-healthy image digest before dispatch (docs/release/staging-to-production.md).
# The `production` GitHub Environment restricts deployment to `main`.
# Most runtime secrets live on the host under infra/production/secrets. This
# workflow ships the Compose assets and refreshes only the cloud-computer
# secrets (COFORGE_CLOUD_CLUSTER_TOKEN / COFORGE_CLOUD_SERVICE_PASSWORD) and the
# Caddy DNS-01 credentials (ALIDNS_ACCESS_KEY_ID / ALIDNS_ACCESS_KEY_SECRET)
# from the production GitHub Environment. It also installs the desktop reverse
# tunnel public key and the ECS private-IP relay when configured
# (docs/operations/cloud-swarm/production-desktop-tunnel.md).

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Staging-healthy image, ghcr.io/lrm-lab/coforge/coforge-web@sha256:..."
        required: true
        type: string
      enable_artifact_checker:
        description: "Deploy the isolated Artifact publish checker"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: lrm-lab/coforge/coforge-web
  REMOTE_ROOT: /home/deploy/coforge-production
  IMAGE: ${{ inputs.image }}

jobs:
  candidate:
    name: Verify the staging-healthy candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      staging_sha: ${{ steps.find_staging.outputs.staging_sha }}
      checker_image: ${{ steps.find_checker.outputs.image }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Require an immutable digest of the Web image
        run: |
          if ! printf '%s' "$IMAGE" | grep -Eq "^ghcr\.io/${IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$"; then
            echo "image must be ghcr.io/${IMAGE_REPOSITORY}@sha256:<64 hex>; got: $IMAGE" >&2
            exit 1
          fi

      - name: Find a healthy staging deployment of this digest
        id: find_staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          records="$(mktemp -d)"
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yml \
            --status success --limit 50 --json databaseId --jq '.[].databaseId'); do
            dir="$records/$run"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name deployment-records --dir "$dir" >/dev/null 2>&1 || continue
            if sha="$(jq -ers --arg image "$IMAGE" '
              first(.[] | select(.artifact_identity == $image and .outcome == "healthy") |
                .source_commit | strings | select(length == 40 and test("^[0-9a-f]{40}$"))) // empty
              ' "$dir/deployment-records.jsonl" 2>/dev/null)"; then
              echo "staging_sha=$sha" >> "$GITHUB_OUTPUT"
              echo "healthy in staging ($sha): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "no healthy staging deployment of $IMAGE among the last 50 successful staging runs" >&2
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve matching Artifact Checker image digest
        if: inputs.enable_artifact_checker
        id: find_checker
        env:
          STAGING_SHA: ${{ steps.find_staging.outputs.staging_sha }}
        run: |
          repo="ghcr.io/lrm-lab/coforge/coforge-artifact-checker"
          digest="$(docker buildx imagetools inspect "${repo}:sha-${STAGING_SHA}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          if printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "image=${repo}@${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "missing Artifact Checker image ${repo}:sha-${STAGING_SHA} for staging commit ${STAGING_SHA}" >&2
            exit 1
          fi

      # web-e2e and web-integration never block a deploy; their latest main
      # conclusions are context for the operator (docs/release/github-actions.md).
      - name: Note the scheduled suites' latest conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Scheduled suites (informational — they never block a deploy)"
            echo ""
            for workflow in web-e2e.yml web-integration.yml; do
              # Informational only: a transient gh failure must not fail the step (bash -e).
              row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --status completed --limit 1 \
                --json conclusion,headSha,createdAt \
                --jq '.[0] // empty | "\(.conclusion) at \(.headSha[0:9]) (\(.createdAt))"' \
                2>/dev/null || echo "query failed")"
              echo "- \`${workflow}\`: ${row:-no completed run}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy and verify Web
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    # Covers remote-deploy.sh's bounded waits at their worst (about 22 minutes on the host):
    # three bounded Web image pull attempts, Compose health, public readiness, and a rollback.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      REMOTE_ASSETS: ${{ github.workspace }}/assets.tgz
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: ./.github/actions/setup-verified-mise
        with:
          install-args: bun

      - name: Require the DNS-01 credentials
        env:
          ALIDNS_ACCESS_KEY_ID: ${{ secrets.ALIDNS_ACCESS_KEY_ID }}
          ALIDNS_ACCESS_KEY_SECRET: ${{ secrets.ALIDNS_ACCESS_KEY_SECRET }}
        run: |
          for name in ALIDNS_ACCESS_KEY_ID ALIDNS_ACCESS_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name is missing from the production GitHub Environment" >&2
              exit 1
            fi
          done

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir" "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Ensure desktop tunnel public key on the ECS
        env:
          PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY: ${{ vars.PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          if [ -z "${PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY}" ]; then
            echo "PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY unset; skipping tunnel key install"
            exit 0
          fi
          case "$PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY" in
            ssh-ed25519\ *|ssh-rsa\ *) ;;
            *)
              echo "PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY must be an OpenSSH public key line" >&2
              exit 1
              ;;
          esac
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "pubkey=\$(cat); mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
             touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys &&
             grep -qxF \"\$pubkey\" ~/.ssh/authorized_keys || echo \"\$pubkey\" >> ~/.ssh/authorized_keys &&
             echo tunnel-key-ready" \
            <<<"$PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY"

      - name: Log in to the image registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i "$SSH_DIR/key" \
              -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o BatchMode=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Copy deployment assets
        run: |
          tar -czf "$REMOTE_ASSETS" \
            infra/artifact-checker.compose.yml \
            infra/artifact-checker-seccomp.json \
            infra/production/docker-compose.yml \
            infra/production/caddy/Caddyfile \
            infra/production/centrifugo/config.yaml \
            infra/production/desktop-tunnel/desktop-tunnel-docker-relay.py \
            infra/production/desktop-tunnel/coforge-production-desktop-docker-relay.user.service \
            scripts/deploy/deploy-secrets.sh \
            scripts/deploy/deploy-release-snapshot.sh \
            scripts/deploy/deploy-diagnostics.sh \
            scripts/deploy/deploy-wildcard-probe.sh \
            scripts/deploy/deploy-image-retention.sh \
            scripts/deploy/catalog-snapshot.sh \
            scripts/deploy/remote-deploy.sh
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "mkdir -p $REMOTE_ROOT && tar -xzf - -C $REMOTE_ROOT" < "$REMOTE_ASSETS"

      - name: Ensure desktop tunnel relay on the ECS
        run: |
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "set -e
             install -d -m 755 \"\$HOME/bin\" \"\$HOME/.config/systemd/user\"
             install -m 755 \
               '$REMOTE_ROOT/infra/production/desktop-tunnel/desktop-tunnel-docker-relay.py' \
               \"\$HOME/bin/desktop-tunnel-docker-relay.py\"
             install -m 644 \
               '$REMOTE_ROOT/infra/production/desktop-tunnel/coforge-production-desktop-docker-relay.user.service' \
               \"\$HOME/.config/systemd/user/coforge-production-desktop-docker-relay.service\"
             systemctl --user daemon-reload
             systemctl --user enable --now coforge-production-desktop-docker-relay.service
             systemctl --user is-active coforge-production-desktop-docker-relay.service"

      # Other runtime secrets stay on the host. Cloud-computer secrets are also
      # kept as production Environment secrets so a deploy can refresh them
      # without replacing the rest of the secrets directory.
      - name: Sync cloud-computer secrets
        env:
          COFORGE_CLOUD_CLUSTER_TOKEN: ${{ secrets.COFORGE_CLOUD_CLUSTER_TOKEN }}
          COFORGE_CLOUD_SERVICE_PASSWORD: ${{ secrets.COFORGE_CLOUD_SERVICE_PASSWORD }}
          ALIDNS_ACCESS_KEY_ID: ${{ secrets.ALIDNS_ACCESS_KEY_ID }}
          ALIDNS_ACCESS_KEY_SECRET: ${{ secrets.ALIDNS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$COFORGE_CLOUD_CLUSTER_TOKEN" ]; then
            echo "COFORGE_CLOUD_CLUSTER_TOKEN is empty; cloud computers stay disabled" >&2
          fi
          bash scripts/deploy/ship-secrets.sh \
            --environment production \
            --secrets-dir "$REMOTE_ROOT/infra/production/secrets" \
            --required "ALIDNS_ACCESS_KEY_ID ALIDNS_ACCESS_KEY_SECRET" \
            --optional "COFORGE_CLOUD_CLUSTER_TOKEN COFORGE_CLOUD_SERVICE_PASSWORD"

      - name: Deploy image and check health
        env:
          CHECKER_IMAGE: ${{ needs.candidate.outputs.checker_image }}
        run: |
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "bash '$REMOTE_ROOT/scripts/deploy/remote-deploy.sh' \
              --project coforge-production \
              --checker-image '$CHECKER_IMAGE' \
              --image '$IMAGE' \
              --compose-file '$REMOTE_ROOT/infra/production/docker-compose.yml' \
              --secrets-dir '$REMOTE_ROOT/infra/production/secrets' \
              --state-file '$REMOTE_ROOT/state.env' \
              --web-health-url http://127.0.0.1:18080/health \
              --public-health-url https://coforge.cn/health \
              --wildcard-probe-host a-00000000-0000-0000-0000-000000000000.coforgeusercontent.com" \
            > remote-report.env

      - name: Log out of the image registry
        if: always()
        run: |
          [ -n "${SSH_DIR:-}" ] || exit 0
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker logout ghcr.io" || true

      - name: Check the remote outcome
        run: |
          cat remote-report.env >> "$GITHUB_STEP_SUMMARY"
          warning="$(sed -n 's/^warning=//p' remote-report.env)"
          if [ -n "$warning" ]; then echo "::warning::$warning"; fi
          outcome="$(sed -n 's/^outcome=//p' remote-report.env)"
          if [ "$outcome" != "healthy" ]; then
            echo "deployment outcome: ${outcome:-missing}" >&2
            exit 1
          fi

      - name: Verify public readiness
        run: curl --fail --silent --show-error --max-time 10 https://coforge.cn/health >/dev/null

      - name: Verify HTTP redirects to HTTPS and HTTPS sends HSTS
        run: bash scripts/deploy/check-https-entry.sh coforge.cn

      - name: Check realtime endpoint responds
        env:
          REALTIME_URL: wss://coforge.cn/connection/websocket
        run: bun scripts/deploy/check-realtime-ws.ts

      # The snapshot the migration safety check reads (docs/agents/git-hooks/migration-safety.md).
      # A failure here never fails a deployment that is already healthy.
      - name: Snapshot table sizes for the migration safety check
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/catalog-snapshot
        with:
          environment: production

  tag:
    name: Update web-production tag
    needs: [candidate, deploy]
    if: needs.candidate.outputs.staging_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Point web-production at the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ needs.candidate.outputs.staging_sha }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/web-production" \
            -f sha="$STAGING_SHA" -F force=true \
          || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref=refs/tags/web-production -f sha="$STAGING_SHA"
