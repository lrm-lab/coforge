name: Deploy Web (production)

# Promotes one Web image digest that is already healthy in staging. The
# `production` GitHub Environment only restricts the deploy to `main`; it has
# no required reviewer, so a human's approval of this exact digest is the
# manual dispatch itself (docs/release/staging-to-production.md). Runtime
# Most runtime secrets live on the host under infra/production/secrets. This
# workflow ships the Compose assets and refreshes only the cloud-computer
# secrets (COFORGE_CLOUD_CLUSTER_TOKEN / COFORGE_CLOUD_SERVICE_PASSWORD) from
# the production GitHub Environment.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Staging-healthy image, ghcr.io/lrm-lab/coforge/coforge-web@sha256:..."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: lrm-lab/coforge/coforge-web
  REMOTE_ROOT: /home/deploy/coforge-production
  IMAGE: ${{ inputs.image }}

jobs:
  candidate:
    name: Verify the staging-healthy candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require an immutable digest of the Web image
        run: |
          if ! printf '%s' "$IMAGE" | grep -Eq "^ghcr\.io/${IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$"; then
            echo "image must be ghcr.io/${IMAGE_REPOSITORY}@sha256:<64 hex>; got: $IMAGE" >&2
            exit 1
          fi

      - name: Find a healthy staging deployment of this digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          records="$(mktemp -d)"
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yml \
            --status success --limit 50 --json databaseId --jq '.[].databaseId'); do
            dir="$records/$run"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name deployment-records --dir "$dir" >/dev/null 2>&1 || continue
            if jq -e --arg image "$IMAGE" \
              'select(.artifact_identity == $image and .outcome == "healthy")' \
              "$dir/deployment-records.jsonl" >/dev/null 2>&1; then
              echo "healthy in staging: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "no healthy staging deployment of $IMAGE among the last 50 successful staging runs" >&2
          exit 1

      # web-e2e and web-integration never block a deploy; their latest main
      # conclusions are context for the operator (docs/release/github-actions.md).
      - name: Note the scheduled suites' latest conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Scheduled suites (informational — they never block a deploy)"
            echo ""
            for workflow in web-e2e.yml web-integration.yml; do
              # Informational only: a transient gh failure must not fail the step (bash -e).
              row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --status completed --limit 1 \
                --json conclusion,headSha,createdAt \
                --jq '.[0] // empty | "\(.conclusion) at \(.headSha[0:9]) (\(.createdAt))"' \
                2>/dev/null || echo "query failed")"
              echo "- \`${workflow}\`: ${row:-no completed run}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy and verify Web
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    # Covers remote-deploy.sh's bounded waits at their worst (about 22 minutes on the host):
    # three bounded Web image pull attempts, Compose health, public readiness, and a rollback.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      REMOTE_ASSETS: ${{ github.workspace }}/assets.tgz
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: ./.github/actions/setup-verified-mise
        with:
          install-args: bun

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir" "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Log in to the image registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i "$SSH_DIR/key" \
              -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o BatchMode=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Copy deployment assets
        run: |
          tar -czf "$REMOTE_ASSETS" \
            infra/production/docker-compose.yml \
            infra/production/caddy/Caddyfile \
            infra/production/centrifugo/config.yaml \
            scripts/deploy/deploy-secrets.sh \
            scripts/deploy/catalog-snapshot.sh \
            scripts/deploy/remote-deploy.sh
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "mkdir -p $REMOTE_ROOT && tar -xzf - -C $REMOTE_ROOT" < "$REMOTE_ASSETS"

      # Other runtime secrets stay on the host. Cloud-computer secrets are also
      # kept as production Environment secrets so a deploy can refresh them
      # without replacing the rest of the secrets directory.
      - name: Sync cloud-computer secrets
        env:
          COFORGE_CLOUD_CLUSTER_TOKEN: ${{ secrets.COFORGE_CLOUD_CLUSTER_TOKEN }}
          COFORGE_CLOUD_SERVICE_PASSWORD: ${{ secrets.COFORGE_CLOUD_SERVICE_PASSWORD }}
        run: |
          if [ -z "$COFORGE_CLOUD_CLUSTER_TOKEN" ]; then
            echo "COFORGE_CLOUD_CLUSTER_TOKEN is empty; cloud computers stay disabled" >&2
          fi
          umask 077
          tar_dir="$(mktemp -d)"
          payload="$(mktemp)"
          trap 'rm -rf -- "$tar_dir" "$payload"' EXIT
          printf '%s' "$COFORGE_CLOUD_CLUSTER_TOKEN" > "$tar_dir/coforge_cloud_cluster_token"
          printf '%s' "$COFORGE_CLOUD_SERVICE_PASSWORD" > "$tar_dir/coforge_cloud_service_password"
          tar -czf "$payload" -C "$tar_dir" .
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "set -eu; \
             secrets_dir='$REMOTE_ROOT/infra/production/secrets'; \
             mkdir -p \"\$secrets_dir\"; \
             chmod 700 \"\$secrets_dir\"; \
             incoming=\$(mktemp -d \"\${secrets_dir}.incoming.XXXXXX\"); \
             trap 'rm -rf -- \"\$incoming\"' EXIT; \
             tar -xzf - -C \"\$incoming\"; \
             for name in coforge_cloud_cluster_token coforge_cloud_service_password; do \
               chmod 600 \"\$incoming/\$name\"; \
               mv -f \"\$incoming/\$name\" \"\$secrets_dir/\$name\"; \
             done" \
            < "$payload"

      - name: Deploy image and check health
        run: |
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "bash '$REMOTE_ROOT/scripts/deploy/remote-deploy.sh' \
              --project coforge-production \
              --image '$IMAGE' \
              --compose-file '$REMOTE_ROOT/infra/production/docker-compose.yml' \
              --secrets-dir '$REMOTE_ROOT/infra/production/secrets' \
              --state-file '$REMOTE_ROOT/state.env' \
              --web-health-url http://127.0.0.1:18080/health \
              --public-health-url https://coforge.cn/health" \
            > remote-report.env

      - name: Log out of the image registry
        if: always()
        run: |
          [ -n "${SSH_DIR:-}" ] || exit 0
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker logout ghcr.io" || true

      - name: Check the remote outcome
        run: |
          cat remote-report.env >> "$GITHUB_STEP_SUMMARY"
          outcome="$(sed -n 's/^outcome=//p' remote-report.env)"
          if [ "$outcome" != "healthy" ]; then
            echo "deployment outcome: ${outcome:-missing}" >&2
            exit 1
          fi

      - name: Verify public readiness
        run: curl --fail --silent --show-error --max-time 10 https://coforge.cn/health >/dev/null

      - name: Verify HTTP redirects to HTTPS and HTTPS sends HSTS
        run: bash scripts/deploy/check-https-entry.sh coforge.cn

      - name: Check realtime endpoint responds
        env:
          REALTIME_URL: wss://coforge.cn/connection/websocket
        run: bun scripts/deploy/check-realtime-ws.ts

      # The snapshot the migration safety check reads (docs/agents/git-hooks/migration-safety.md).
      # A failure here never fails a deployment that is already healthy.
      - name: Snapshot table sizes for the migration safety check
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/catalog-snapshot
        with:
          environment: production
