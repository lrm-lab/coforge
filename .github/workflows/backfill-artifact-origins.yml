name: Backfill artifact origins (task #artifacts:#27)

# Re-runnable data task: record, for artifacts that existed before origins were recorded, the earliest
# message in the artifact's own conversation that links it. See
# apps/web/scripts/backfill-artifact-origins.ts (bundled into the image at
# .ops/backfill-artifact-origins.js by apps/web/Dockerfile).
#
# Dispatched by an operator. The DB is not reachable from CI, so, as the deploys do, this runs the
# bundled script inside the already-deployed Web container over SSH, using the chosen GitHub
# Environment's SSH secrets. Run `dry-run` first and read the counts in the log. It only fills an
# empty origin, or replaces one written by a later message; there is no rollback, and a wrong origin
# can be cleared with an UPDATE and the task run again.
#
# The production Environment has no required reviewer (task #498), so there is no human gate from
# the platform: an `apply` to production must repeat a confirmation phrase.
#
# Every free-text input is validated against a strict shape in `Validate inputs` and quoted with
# `printf %q` before it reaches the remote shell; a dispatch's text never runs on the deploy host.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to run"
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: "dry-run counts candidate messages; apply writes"
        required: true
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "To apply in production, type: apply-production"
        required: false
        type: string
      fromMessageId:
        description: "Resume from this Message.id (uuid7, printed on a timed-out run)"
        required: false
        type: string
      scanWindow:
        description: "Message ids scanned per window"
        required: false
        type: string
        default: "5000"
      batchSize:
        description: "Messages written per batch"
        required: false
        type: string
        default: "500"
      maxMinutes:
        description: "Stop after this many minutes and print the resume cursor"
        required: false
        type: string
        default: "12"
      pauseMs:
        description: "Pause between batches, milliseconds"
        required: false
        type: string
        default: "100"

permissions:
  contents: read

concurrency:
  group: backfill-artifact-origins-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Run the backfill
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Require the confirmation phrase for a production write
        if: inputs.environment == 'production' && inputs.mode == 'apply'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "apply-production" ]; then
            echo "A production apply must set confirm to 'apply-production'." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate inputs
        env:
          FROM_ID: ${{ inputs.fromMessageId }}
          SCAN_WINDOW: ${{ inputs.scanWindow }}
          BATCH_SIZE: ${{ inputs.batchSize }}
          MAX_MINUTES: ${{ inputs.maxMinutes }}
          PAUSE_MS: ${{ inputs.pauseMs }}
          MODE: ${{ inputs.mode }}
        run: bash apps/web/scripts/validate-backfill-inputs.sh

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Resolve the Web container
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          PROJECT: coforge-${{ inputs.environment }}
        run: |
          remote() {
            ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "$@"
          }
          ids="$(remote "docker ps -q --filter label=com.docker.compose.project=$PROJECT \
            --filter label=com.docker.compose.service=web --filter status=running")"
          container="$(printf '%s\n' "$ids" | head -n 1)"
          if [ -z "$container" ]; then
            echo "No running Web container for $PROJECT" >&2
            exit 1
          fi
          echo "WEB_CONTAINER=$container" >> "$GITHUB_ENV"

      - name: Run the backfill
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          MODE: ${{ inputs.mode }}
          FROM_ID: ${{ inputs.fromMessageId }}
          SCAN_WINDOW: ${{ inputs.scanWindow }}
          BATCH_SIZE: ${{ inputs.batchSize }}
          MAX_MINUTES: ${{ inputs.maxMinutes }}
          PAUSE_MS: ${{ inputs.pauseMs }}
        run: |
          # One line of validated, %q-quoted args — no multi-line block the remote shell would split.
          args=""
          case "$MODE" in
            dry-run) args="$args --dry-run";;
            apply)   args="$args --apply";;
          esac
          [ -n "$FROM_ID" ] && args="$args --from-message-id $(printf %q "$FROM_ID")"
          [ -n "$SCAN_WINDOW" ] && args="$args --scan-window $(printf %q "$SCAN_WINDOW")"
          [ -n "$BATCH_SIZE" ] && args="$args --batch-size $(printf %q "$BATCH_SIZE")"
          [ -n "$MAX_MINUTES" ] && args="$args --max-minutes $(printf %q "$MAX_MINUTES")"
          [ -n "$PAUSE_MS" ] && args="$args --pause-ms $(printf %q "$PAUSE_MS")"
          ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker exec -i -w /app '$WEB_CONTAINER' bun /app/.ops/backfill-artifact-origins.js $args"
