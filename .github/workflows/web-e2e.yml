name: Web browser e2e

# The browser e2es (apps/web/test/*.e2e.ts) need a built Web, PostgreSQL, Redis, Centrifugo and a
# headless Chrome, which CI's jobs do not have. This runs the ones listed in
# scripts/e2e/web-e2e-ci.txt once a day and on demand, in two shards; any failing file turns the
# run red. It blocks nothing and publishes nothing; docs/release/web-e2e.md.
on:
  schedule:
    # 19:47 UTC: off the hour, and half an hour after Web integration so the two do not queue.
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A manual run queues behind a running one instead of cancelling it.
concurrency:
  group: web-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser e2e (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard's failure does not hide the other's.
      fail-fast: false
      matrix:
        shard: [1, 2]

    # The images staging runs, by digest; scripts/ci/web-integration-images.test.ts fails when
    # they drift apart. Centrifugo is started by the runner, not as a service: its proxies call the
    # Web on the runner, which needs host networking and the checked-in config file.
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: coforge
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coforge -d coforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2.6@sha256:3055dc25265b0c19ec90a1756dad4e0faff6f79e2557a6ac3d1274e39ee906f6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coforge:test@127.0.0.1:5432/coforge
      REDIS_URL: redis://127.0.0.1:6379
      CENTRIFUGO_IMAGE: centrifugo/centrifugo:v6.9.2@sha256:f89352e38ef8043aaaa9045dec41cc8f2d35075b86ff553d4091ac19b547a3a6
      # Ubuntu runners have no unprivileged user namespaces for Chrome's sandbox
      # (docs/agents/testing.md); agent-browser reads only this variable for Chrome's flags.
      AGENT_BROWSER_ARGS: --no-sandbox
      # The same for the files that launch Chrome themselves (apps/web/test/helpers/headless-chrome.ts);
      # the runner points COFORGE_E2E_CHROME at the Chrome agent-browser installed.
      COFORGE_E2E_CHROME_ARGS: --no-sandbox
      E2E_OUTPUT: ${{ github.workspace }}/.amp/e2e-ci

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false
          cache: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The version the list was measured with; Chrome and its system libraries come with it.
      - name: Install agent-browser and Chrome
        run: |
          npm install --global agent-browser@0.41.2
          agent-browser install --with-deps

      - name: Run the shard
        shell: bash
        run: ./scripts/e2e/run-web-e2e-ci.sh "${{ matrix.shard }}" 2

      - name: Summarize the shard
        if: always()
        shell: bash
        run: |
          summary="$E2E_OUTPUT/summary.md"
          [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY" || true

      # Each file's output, the Web's and Centrifugo's logs, and the screenshots the tests took.
      - name: Keep the output of a failed shard
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-shard-${{ matrix.shard }}
          path: |
            ${{ env.E2E_OUTPUT }}/logs
            ${{ env.E2E_OUTPUT }}/screenshots
            ${{ env.E2E_OUTPUT }}/summary.md
          if-no-files-found: ignore
          retention-days: 7
