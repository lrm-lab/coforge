name: Web browser e2e

# The browser e2es (apps/web/test/*.e2e.ts) need a built Web, PostgreSQL, Redis, Centrifugo and a
# headless Chrome, which CI's jobs do not have. This runs the ones listed in
# scripts/e2e/web-e2e-ci.txt once a day and on demand, in four shards; any failing file turns the
# run red. It blocks nothing and publishes nothing; docs/release/web-e2e.md.
on:
  schedule:
    # 19:47 UTC: off the hour, and half an hour after Web integration so the two do not queue.
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      file:
        description: "Run only this apps/web/test file (e.g. e2e-foo.e2e.ts), on one runner"
        required: false
        default: ""
      repeat:
        description: "With file: how many times in a row (1-99)"
        required: false
        default: "1"

permissions:
  contents: read

# Runs on different refs run in parallel; a repeat trigger on the same ref queues
# behind the running one instead of cancelling it.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser e2e (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # Setup (images, install, build, services) once took ~24 of the 30 minutes on a slow runner,
    # leaving the shard's files no room; the per-file `timeout 360` still bounds each test.
    timeout-minutes: 45
    strategy:
      # One shard's failure does not hide the others'.
      fail-fast: false
      matrix:
        # One file soaked on one runner, or the whole list in four shards.
        shard: ${{ fromJSON(inputs.file && '[1]' || '[1, 2, 3, 4]') }}

    # The images staging runs, by digest; scripts/ci/web-integration-images.test.ts fails when
    # they drift apart. Centrifugo is started by the runner, not as a service: its proxies call the
    # Web on the runner, which needs host networking and the checked-in config file.
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: coforge
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coforge -d coforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2.6@sha256:3055dc25265b0c19ec90a1756dad4e0faff6f79e2557a6ac3d1274e39ee906f6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coforge:test@127.0.0.1:5432/coforge
      REDIS_URL: redis://127.0.0.1:6379
      CENTRIFUGO_IMAGE: centrifugo/centrifugo:v6.9.2@sha256:f89352e38ef8043aaaa9045dec41cc8f2d35075b86ff553d4091ac19b547a3a6
      # Ubuntu runners have no unprivileged user namespaces for Chrome's sandbox
      # (docs/agents/testing.md); agent-browser reads only this variable for Chrome's flags.
      AGENT_BROWSER_ARGS: --no-sandbox
      # The same for the files that launch Chrome themselves (apps/web/test/helpers/headless-chrome.ts);
      # the runner points COFORGE_E2E_CHROME at the Chrome agent-browser installed.
      COFORGE_E2E_CHROME_ARGS: --no-sandbox
      AGENT_BROWSER_VERSION: "0.41.2"
      E2E_OUTPUT: ${{ github.workspace }}/.artifacts/e2e-ci

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: scripts/ci/retry.sh 5 10 -- mise install

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Chrome version for cache key
        id: chrome-version
        shell: bash
        run: |
          chrome_version="$(
            scripts/ci/retry.sh 3 5 -- curl -fsSL \
              https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json |
              jq -r '.channels.Stable.version // empty'
          )" || chrome_version=""
          echo "version=$chrome_version" >> "$GITHUB_OUTPUT"

      # Cache only the pinned CLI prefix and downloaded Chrome binary; never cache system apt state.
      - name: Cache agent-browser and Chrome
        id: agent-browser-cache
        if: steps.chrome-version.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/agent-browser-cli
            ~/.agent-browser/browsers
          key: agent-browser-${{ runner.os }}-${{ runner.arch }}-${{ env.AGENT_BROWSER_VERSION }}-chrome-${{ steps.chrome-version.outputs.version }}

      # The version the list was measured with; Chrome and its system libraries come with it.
      # System libraries are always installed via --with-deps on each fresh runner, while a cache hit
      # on ~/.agent-browser/browsers skips re-downloading the Chrome binary zip.
      - name: Install agent-browser and Chrome
        shell: bash
        run: |
          cli_dir="$HOME/.cache/agent-browser-cli"
          cli_bin="$cli_dir/node_modules/.bin/agent-browser"
          if [ ! -x "$cli_bin" ] || [ "$("$cli_bin" --version 2>/dev/null || true)" != "agent-browser $AGENT_BROWSER_VERSION" ]; then
            rm -rf "$cli_dir"
            mkdir -p "$cli_dir"
            scripts/ci/retry.sh 5 10 -- npm install --prefix "$cli_dir" "agent-browser@${AGENT_BROWSER_VERSION}"
          fi
          printf '%s\n' "$cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$cli_dir/node_modules/.bin:$PATH"
          scripts/ci/retry.sh 5 10 -- agent-browser install --with-deps

      - name: Run the shard
        id: run-shard
        shell: bash
        env:
          E2E_FILE: ${{ inputs.file }}
          E2E_REPEAT: ${{ inputs.repeat }}
        run: |
          date -u +%s > "${RUNNER_TEMP}/web-e2e-shard-started-at.epoch"
          ./scripts/e2e/run-web-e2e-ci.sh "${{ matrix.shard }}" 4

      - name: Summarize the shard
        if: always()
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          E2E_FILE: ${{ inputs.file }}
          E2E_REPEAT: ${{ inputs.repeat }}
          SHARD_OUTCOME: ${{ steps.run-shard.outcome }}
          STARTED_AT_FILE: ${{ runner.temp }}/web-e2e-shard-started-at.epoch
          SUMMARY_SHA: ${{ github.sha }}
          SUMMARY_RUN_ID: ${{ github.run_id }}
          SUMMARY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          summary="$E2E_OUTPUT/summary.md"
          [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY" || true
          if command -v bun >/dev/null 2>&1 && [ -f scripts/ci/web-e2e-summary.ts ]; then
            bun scripts/ci/web-e2e-summary.ts \
              --input "$summary" \
              --output "$E2E_OUTPUT/summary.json" \
              --shard "$SHARD" \
              --shards "$SHARDS" \
              --outcome "$SHARD_OUTCOME" \
              --started-at-file "$STARTED_AT_FILE" \
              --e2e-file "$E2E_FILE" \
              --e2e-repeat "$E2E_REPEAT" \
              --sha "$SUMMARY_SHA" \
              --run-id "$SUMMARY_RUN_ID" \
              --run-attempt "$SUMMARY_RUN_ATTEMPT"
          fi

      # Always upload the compact per-shard summary so green and near-green runs provide exact
      # per-file timings for shard-budget planning without uploading heavy logs or screenshots.
      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-shard-${{ matrix.shard }}-of-4-summary
          path: |
            ${{ env.E2E_OUTPUT }}/summary.md
            ${{ env.E2E_OUTPUT }}/summary.json
          if-no-files-found: ignore
          retention-days: 7

      # Each file's output, the Web's and Centrifugo's logs, and the screenshots the tests took.
      - name: Keep the output of a failed shard
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-shard-${{ matrix.shard }}-of-4
          path: |
            ${{ env.E2E_OUTPUT }}/logs
            ${{ env.E2E_OUTPUT }}/screenshots
            ${{ env.E2E_OUTPUT }}/ui-sweep
            ${{ env.E2E_OUTPUT }}/summary.md
          if-no-files-found: ignore
          retention-days: 7
