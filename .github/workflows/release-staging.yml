name: Publish Computer (staging)
run-name: ${{ inputs.withdraw_version && format('Withdraw Computer {0} from staging', inputs.withdraw_version) || format('Publish Computer {0} to staging', inputs.version || (inputs.line && format('the next {0} dev build', inputs.line)) || 'the next dev build') }}

# Publishing a local Computer distribution is manual, never automatic on a push to main - see
# docs/release/github-actions.md: a client release leaves a persistent artifact set behind, so a
# build per merge is waste. Do not add a `push:` trigger here.
#
# publish.ts numbers each publication by the version rule in docs/release/github-actions.md, reading
# production's and staging's `latest`, and refuses an out-of-order version before compiling.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Numbered development version of the release line to publish (e.g. 0.1.5-dev.3). Leave empty
          to publish the line's next dev build: the smallest unused <line>-dev.<N>.
        required: false
        type: string
      line:
        description: >-
          Start a new release line (e.g. 0.2.0) instead of the one production's latest implies. It must
          be above production's latest and not below staging's line.
        required: false
        type: string
      notes_en:
        description: >-
          Release notes in English (Markdown, at most 16000 characters), written for users; required
          for a publication (docs/release/release-notes.md).
        required: false
        type: string
      notes_zh_cn:
        description: Release notes in Simplified Chinese (Markdown, at most 16000 characters); required for a publication.
        required: false
        type: string

      withdraw_version:
        description: "Withdraw this numbered dev version instead of publishing (requires both manifest hashes and restore_version)"
        required: false
        type: string
      manifest_sha256:
        description: "Expected SHA-256 of the withdrawn version's manifest"
        required: false
        type: string
      restore_version:
        description: "Previously published complete dev version to restore as latest"
        required: false
        type: string
      restore_manifest_sha256:
        description: "Expected SHA-256 of the restored version's manifest"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-staging
  cancel-in-progress: false

jobs:
  # Release notes are required for every publication. Checked beside the gates, they fail the run
  # before the publish job, which needs both. The inputs are not required in the schema because a
  # withdrawal publishes nothing and needs none: its run skips the step and the job still succeeds.
  notes-check:
    name: Check release notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The script needs Bun alone, not the whole toolchain.
      - name: Install pinned Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          cache: false
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The notes are caller-controlled Markdown: they reach the script only through env vars.
      - name: Require both languages of release notes
        if: inputs.withdraw_version == ''
        env:
          RELEASE_NOTES_EN: ${{ inputs.notes_en }}
          RELEASE_NOTES_ZH_CN: ${{ inputs.notes_zh_cn }}
        run: bun scripts/release/release-notes.ts --check

  gates:
    name: Validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      track: local

  publish:
    name: Build and publish Computer
    needs: [gates, notes-check]
    # macOS, for Apple's codesign.
    runs-on: macos-latest
    environment: staging
    outputs:
      version: ${{ steps.publish.outputs.version }}
    # `id-token: write` lets this job mint the GitHub OIDC token it exchanges for the Alibaba
    # Cloud STS credential below; the validation job does not need it.
    permissions:
      contents: read
      id-token: write
    # Through transfer acceleration a publish takes about 2 minutes (dev.72-75); 30 minutes
    # leaves room for a slow day without letting a stalled upload hold the job indefinitely.
    timeout-minutes: 30
    steps:
      - name: Require a numbered development version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ] && ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$ ]]; then
            echo "staging requires a numbered development version, for example 0.1.3-dev.1" >&2
            exit 1
          fi

      - name: Validate withdrawal inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LINE: ${{ inputs.line }}
          INPUT_WITHDRAW_VERSION: ${{ inputs.withdraw_version }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          INPUT_RESTORE_VERSION: ${{ inputs.restore_version }}
          INPUT_RESTORE_MANIFEST_SHA256: ${{ inputs.restore_manifest_sha256 }}
        run: |
          if [ -n "$INPUT_WITHDRAW_VERSION$INPUT_MANIFEST_SHA256$INPUT_RESTORE_VERSION$INPUT_RESTORE_MANIFEST_SHA256" ]; then
            if [ -n "$INPUT_VERSION$INPUT_LINE" ] || [ -z "$INPUT_WITHDRAW_VERSION" ] || [ -z "$INPUT_RESTORE_VERSION" ] ||
               ! [[ "$INPUT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
               ! [[ "$INPUT_RESTORE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "withdrawal requires both versions and manifest hashes, without a publish version or line" >&2
              exit 1
            fi
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          cache: false
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol sources
        run: bun run --cwd packages/coforge-sdk generate

      - name: Request an OIDC token for Alibaba Cloud
        env:
          AUDIENCE: sts.aliyuncs.com
        run: |
          token_file="$RUNNER_TEMP/aliyun-oidc-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            | jq -r '.value' > "$token_file"
          chmod 600 "$token_file"
          echo "ALIBABA_CLOUD_OIDC_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          # The RAM role's trust policy matches these three claims exactly; print them so a
          # trust-policy mismatch is diagnosable from the run log. The payload is public run
          # metadata; the signature (the only secret part) is never printed.
          payload="$(cut -d. -f2 "$token_file" | tr '_-' '/+' | awk '{ n = length($0) % 4; if (n) $0 = $0 substr("==", 1, 4 - n); print }' | base64 -d)"
          printf 'OIDC claims: %s\n' "$(printf '%s' "$payload" | jq -c '{iss, aud, sub, exp}')"

      # This role's trust policy grants only `repo:lrm-lab@340480458/coforge@1412896035:environment:staging` -
      # GitHub's OIDC token asserts the workflow's repo/ref/environment, and Alibaba Cloud checks
      # that assertion before issuing an STS token. No long-term AccessKey exists for this
      # publisher; a compromised token can only assume the role from this exact repo/environment,
      # and it expires with the run.
      - name: Build six platforms, upload, and verify release
        id: publish
        if: inputs.withdraw_version == ''
        # inputs.version and inputs.line are passed through env vars, not substituted into the script
        # body: a workflow_dispatch string input is caller-controlled, and substituting it inline
        # would let its literal text be interpreted as shell syntax before publish.ts ever validates
        # it. Without a version, publish.ts picks the line's next dev number from the feed; either
        # way it writes the version it published to this step's outputs.
        env:
          ALIBABA_CLOUD_ROLE_ARN: acs:ram::1085194890307801:role/coforge-release-publisher
          ALIBABA_CLOUD_OIDC_PROVIDER_ARN: acs:ram::1085194890307801:oidc-provider/github-actions
          ALIBABA_CLOUD_ROLE_SESSION_NAME: github-actions-${{ github.run_id }}
          # The credential chain would otherwise fall through to the ECS metadata service and a
          # credentials URI after an OIDC failure, spending minutes on connection timeouts before
          # reporting the real error.
          ALIBABA_CLOUD_ECS_METADATA_DISABLED: "true"
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LINE: ${{ inputs.line }}
          RELEASE_COMMIT: ${{ github.sha }}
          # Signs the darwin executables (scripts/release/darwin-signing.ts); no other step holds it.
          COFORGE_DARWIN_SIGNING_KEY: ${{ secrets.COFORGE_DARWIN_SIGNING_KEY }}
        run: |
          release=()
          if [ -n "$INPUT_VERSION" ]; then release+=(--version "$INPUT_VERSION"); fi
          if [ -n "$INPUT_LINE" ]; then release+=(--line "$INPUT_LINE"); fi
          # GitHub-hosted runners reach oss-cn-beijing over the public cross-border path, measured
          # at 17-56 KB/s from dev.59 on, on both Linux and macOS runners. OSS transfer
          # acceleration routes the upload over Alibaba Cloud's backbone instead; the endpoint is
          # global, so the bucket's region is passed for V4 signing.
          bun scripts/release/publish.ts \
            "${release[@]}" \
            --production-feed-url "https://releases.coforge.cn" \
            --commit "$RELEASE_COMMIT" \
            --feed-url "https://releases-staging.coforge.cn" \
            --endpoint oss-accelerate.aliyuncs.com \
            --region oss-cn-beijing

      - name: Withdraw selected staging release
        if: inputs.withdraw_version != ''
        env:
          ALIBABA_CLOUD_ROLE_ARN: acs:ram::1085194890307801:role/coforge-release-publisher
          ALIBABA_CLOUD_OIDC_PROVIDER_ARN: acs:ram::1085194890307801:oidc-provider/github-actions
          ALIBABA_CLOUD_ROLE_SESSION_NAME: github-actions-${{ github.run_id }}
          ALIBABA_CLOUD_ECS_METADATA_DISABLED: "true"
          INPUT_WITHDRAW_VERSION: ${{ inputs.withdraw_version }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          INPUT_RESTORE_VERSION: ${{ inputs.restore_version }}
          INPUT_RESTORE_MANIFEST_SHA256: ${{ inputs.restore_manifest_sha256 }}
        run: |
          bun scripts/release/withdraw.ts \
            --version "$INPUT_WITHDRAW_VERSION" \
            --manifest-sha256 "$INPUT_MANIFEST_SHA256" \
            --restore-version "$INPUT_RESTORE_VERSION" \
            --restore-manifest-sha256 "$INPUT_RESTORE_MANIFEST_SHA256"
          {
            echo "## Computer withdrawn from staging"
            echo "- Withdrawn: $INPUT_WITHDRAW_VERSION ($INPUT_MANIFEST_SHA256)"
            echo "- Restored: $INPUT_RESTORE_VERSION ($INPUT_RESTORE_MANIFEST_SHA256)"
            echo "- Verified: restored objects and latest, private origin, and absence of all 14 withdrawn objects."
            echo "- CDN caches and installed copies are separate; this operation does not purge or reinstall them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize published release
        if: inputs.withdraw_version == ''
        env:
          RELEASE_VERSION: ${{ steps.publish.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Computer published to staging"
            echo ""
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Source commit: ${RELEASE_COMMIT}"
            echo "- Platforms: Linux, macOS, Windows (x64 and arm64)"
            echo "- macOS executables: signed with the Computer's code-signing certificate; designated requirement verified"
            echo "- Verified: uploaded bytes, checksums, private storage access, and latest version selector"
            echo "- CDN delivery and complete install/upgrade/rollback acceptance are separate checks."
          } >> "$GITHUB_STEP_SUMMARY"

  # Registered once `latest` has moved, by the reusable notes workflow, which holds the catalog token
  # but no OSS credential; `gh run rerun --failed` repeats only this job if the catalog was
  # unreachable.
  notes:
    name: Register release notes
    needs: publish
    if: inputs.withdraw_version == ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-notes.yml
    with:
      environment: staging
      version: ${{ needs.publish.outputs.version }}
      notes_en: ${{ inputs.notes_en }}
      notes_zh_cn: ${{ inputs.notes_zh_cn }}
    secrets:
      COFORGE_RELEASE_CATALOG_TOKEN_STAGING: ${{ secrets.COFORGE_RELEASE_CATALOG_TOKEN_STAGING }}
