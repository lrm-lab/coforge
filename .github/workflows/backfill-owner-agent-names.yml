name: Backfill owner-named assistant names (task #495)

# One-time (re-runnable) data task: rewrite owner-named assistants whose stored name is an
# auto-name to the current naming rule for the owner's name and language. See
# apps/web/scripts/backfill-owner-agent-names.ts (bundled into the image at
# .ops/backfill-owner-agent-names.js by apps/web/Dockerfile).
#
# Dispatched by an operator. The DB is not reachable from CI, so — as the deploys do — this runs
# the bundled script inside the already-deployed Web container over SSH, using the chosen GitHub
# Environment's SSH secrets. Run `dry-run` first and read the count and samples in the log.
#
# The production Environment has no required reviewer (task #498), so there is no human gate from
# the platform: an `apply` to production must repeat a confirmation phrase, and the job exports a
# backup of `agents.displayName` as an artifact before it writes.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to run"
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: "dry-run reports only; apply writes"
        required: true
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "To apply in production, type: apply-production"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backfill-owner-agent-names-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Run the backfill
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Require the confirmation phrase for a production apply
        if: inputs.mode == 'apply' && inputs.environment == 'production'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "apply-production" ]; then
            echo "A production apply must set confirm to 'apply-production'." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Resolve the Web container
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          PROJECT: coforge-${{ inputs.environment }}
        run: |
          remote() {
            ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "$@"
          }
          container="$(remote "docker ps -q \
            --filter label=com.docker.compose.project=$PROJECT \
            --filter label=com.docker.compose.service=web")"
          if [ -z "$container" ]; then
            echo "No running Web container for $PROJECT" >&2
            exit 1
          fi
          echo "WEB_CONTAINER=$container" >> "$GITHUB_ENV"

      - name: Back up agents.displayName before an apply
        if: inputs.mode == 'apply'
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker exec -i '$WEB_CONTAINER' bun .ops/backfill-owner-agent-names.js --backup" \
            > agents-displayName-backup.jsonl
          wc -l agents-displayName-backup.jsonl

      - name: Upload the backup
        if: inputs.mode == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agents-displayName-backup-${{ inputs.environment }}
          path: agents-displayName-backup.jsonl
          retention-days: 90

      - name: Run the backfill
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          FLAG: ${{ inputs.mode == 'apply' && '--apply' || '--dry-run' }}
        run: |
          ssh -i "$SSH_DIR/key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "docker exec -i '$WEB_CONTAINER' bun .ops/backfill-owner-agent-names.js $FLAG"
