name: Install desktop tunnel key

# One-shot / idempotent: append the Swarm manager's tunnel public key to
# deploy@ECS authorized_keys. The private key stays on the intranet host.
# docs/operations/cloud-swarm/{staging,production}-desktop-tunnel.md
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: install-desktop-tunnel-key-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  install:
    name: Install authorized_keys entry (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Require the tunnel public key variable
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TUNNEL_PUBLIC_KEY: ${{ inputs.environment == 'staging' && vars.STAGING_DESKTOP_TUNNEL_PUBLIC_KEY || vars.PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY }}
        run: |
          var_name=$([ "$ENVIRONMENT" = staging ] && echo STAGING_DESKTOP_TUNNEL_PUBLIC_KEY || echo PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY)
          if [ -z "${TUNNEL_PUBLIC_KEY}" ]; then
            echo "Set $ENVIRONMENT Environment variable $var_name to the Swarm manager pubkey" >&2
            exit 1
          fi
          case "$TUNNEL_PUBLIC_KEY" in
            ssh-ed25519\ *|ssh-rsa\ *) ;;
            *)
              echo "$var_name must be an OpenSSH public key line" >&2
              exit 1
              ;;
          esac

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir" "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Append the tunnel public key on the ECS
        env:
          TUNNEL_PUBLIC_KEY: ${{ inputs.environment == 'staging' && vars.STAGING_DESKTOP_TUNNEL_PUBLIC_KEY || vars.PRODUCTION_DESKTOP_TUNNEL_PUBLIC_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          ssh -i "$SSH_DIR/key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "pubkey=\$(cat); mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
             touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys &&
             grep -qxF \"\$pubkey\" ~/.ssh/authorized_keys || echo \"\$pubkey\" >> ~/.ssh/authorized_keys &&
             echo installed" \
            <<<"$TUNNEL_PUBLIC_KEY"
