name: Post-deploy performance check

# Task #594. Runs after each successful Web deploy — staging and production —
# waits 30 minutes for traffic, then compares Server Function p95 latency and
# 5xx rates across the image boundary (docs/release/perf-regression-check.md).
# A workflow_run trigger keeps the check out of the deploy run's concurrency
# group: a 30+ minute observation window must not queue the next deploy.
# Regressions annotate this run and land in the job summary; rollback stays a
# printed command for a human.

on:
  workflow_run:
    workflows: ["Deploy Web (staging)", "Deploy Web (production)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: perf-check-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  check:
    name: Post-deploy performance check
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.name == 'Deploy Web (staging)' && 'staging' || 'production' }}
    timeout-minutes: 60
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      PERF_ENV: ${{ github.event.workflow_run.name == 'Deploy Web (staging)' && 'staging' || 'production' }}
      REMOTE_ROOT: ${{ github.event.workflow_run.name == 'Deploy Web (staging)' && '/home/deploy/coforge-staging' || '/home/deploy/coforge-production' }}
      PROJECT: ${{ github.event.workflow_run.name == 'Deploy Web (staging)' && 'coforge-staging' || 'coforge-production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          cache: false
          install_args: bun

      - name: Prepare the SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          if [ "$DEPLOY_SSH_USER" != "deploy" ]; then
            echo "DEPLOY_SSH_USER must be the non-root deploy identity" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 700 "$ssh_dir" "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Compare Server Function latency and errors
        run: |
          bun scripts/deploy/perf-regression-check.ts \
            --environment "$PERF_ENV" \
            --ssh-target "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            --ssh-key "$SSH_DIR/key" \
            --known-hosts "$SSH_DIR/known_hosts" \
            --remote-root "$REMOTE_ROOT" \
            --project "$PROJECT" \
            --report-file "$RUNNER_TEMP/perf-report.md"

      - name: Append the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/perf-report.md" ]; then
            cat "$RUNNER_TEMP/perf-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
