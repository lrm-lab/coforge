name: Build Artifact Checker image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: "Immutable digest reference for coforge-artifact-checker"
        value: ${{ jobs.image.outputs.image }}
  push:
    branches: [main]
    paths:
      - services/artifact-checker/**

permissions:
  contents: read

concurrency:
  group: artifact-checker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: lrm-lab/coforge/coforge-artifact-checker

jobs:
  image:
    name: Build and push Artifact Checker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cache-binary: false

      - name: Check for existing Artifact Checker image for this source tree
        id: existing
        run: |
          checker_sha="$(git log -n 1 --format=%H -- services/artifact-checker)"
          echo "checker_sha=$checker_sha" >> "$GITHUB_OUTPUT"
          repo="ghcr.io/${IMAGE_REPOSITORY}"
          digest="$(docker buildx imagetools inspect "${repo}:sha-${checker_sha}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          if printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: push
        if: steps.existing.outputs.hit != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/artifact-checker
          platforms: linux/amd64
          push: true
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,rewrite-timestamp=true
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Record image digest
        id: identity
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "failed to resolve Artifact Checker image digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ env.IMAGE_REPOSITORY }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Tag image with checker tree commit and source commit
        env:
          CHECKER_SHA: ${{ steps.existing.outputs.checker_sha }}
          HIT: ${{ steps.existing.outputs.hit }}
          DIGEST: ${{ steps.identity.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          repo="ghcr.io/${IMAGE_REPOSITORY}"
          if [ "$HIT" != "true" ] && [ -n "$CHECKER_SHA" ]; then
            docker buildx imagetools create -t "${repo}:sha-${CHECKER_SHA}" "${repo}@${DIGEST}"
          fi
          if [ "$CHECKER_SHA" != "$SOURCE_SHA" ]; then
            docker buildx imagetools create -t "${repo}:sha-${SOURCE_SHA}" "${repo}@${DIGEST}"
          fi

      - name: Print image digest
        env:
          REUSED: ${{ steps.existing.outputs.hit }}
          DIGEST: ${{ steps.identity.outputs.digest }}
        run: |
          echo "ghcr.io/${IMAGE_REPOSITORY}@${DIGEST} (reused=${REUSED})" >> "$GITHUB_STEP_SUMMARY"
