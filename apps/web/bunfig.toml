[test]
# The Daemon's Agent-state stores default to a machine-wide directory under the OS temp root;
# this preload points every test file at a directory of its own (the Daemon package owns it).
# The second preload bounds every test PostgreSQL session and pool, so an abandoned query cannot
# cascade into `too many clients already` (its own comment says why).
preload = [
  "../../packages/daemon/test/cli-temp-state.preload.ts",
  "./test/pg-connection-guards.preload.ts",
]
