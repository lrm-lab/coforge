syntax = "proto3";

package coforge.rpc.v1;

message AgentWorkspaceFilesListRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string dir_path = 6;
  bool include_hidden = 7;
  string message_type = 8;
}

message AgentWorkspaceFilesListResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string dir_path = 6;
  bool include_hidden = 7;
  string message_type = 8;
  string status = 9;
  string root_path = 10;
  repeated AgentWorkspaceFileEntry entries = 11;
}

message AgentWorkspaceScanRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string message_type = 5;
  // False lists the workspace directories alone; true also walks each of them under the Daemon's
  // budgets and fills the entries' file_count, total_size_bytes and statistics_status.
  bool with_statistics = 6;
}

message AgentWorkspaceScanEntry {
  string agent_id = 1;
  string status = 2;
  string root_path = 3;
  uint64 modified_at_ms = 4;
  // Lower bounds when statistics_status is "truncated"; 0 in a listing-only scan.
  uint64 file_count = 5;
  uint64 total_size_bytes = 6;
  // Empty in a listing-only scan; otherwise "complete", "truncated" or "skipped".
  string statistics_status = 7;
}

message AgentWorkspaceScanResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string message_type = 5;
  repeated AgentWorkspaceScanEntry workspaces = 6;
  // Echoes the request: whether the entries carry measurements or only the listing.
  bool with_statistics = 7;
}

message AgentWorkspaceFileEntry {
  string name = 1;
  string type = 2;
  uint64 size_bytes = 3;
  uint64 modified_at_ms = 4;
}

message AgentWorkspaceFileReadRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string path = 6;
  string message_type = 7;
}

message AgentWorkspaceFileReadResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string path = 6;
  string message_type = 7;
  string status = 8;
  uint64 size_bytes = 9;
  uint64 modified_at_ms = 10;
  string text = 11;
  // Set together, and only for a ``status == "ok"`` read of a previewable image: the media type
  // the bytes really are (sniffed, never the file name), and the file's bytes themselves. `text`
  // is empty in that case, and `content` is empty for every read that fills `text` instead.
  string content_type = 12;
  bytes content = 13;
}

message AgentWorkspaceDeleteRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string message_type = 6;
}

message AgentWorkspaceDeleteResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string message_type = 6;
  string status = 7;
}
