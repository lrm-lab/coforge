syntax = "proto3";

package coforge.rpc.v1;

// Server to daemon: the client secret of an app a person just registered for an Agent, for that
// Agent alone. The cloud keeps only the secret's hash; the daemon hands the secret to the Agent as
// a transient App Inbox item and never writes it to disk or a log. Best effort: it is sent once,
// and only to a daemon whose ready advertised `app-registration-notice:v1`.
message AppRegistrationNotice {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string app_key = 6;
  string app_name = 7;
  string message_type = 8;
  string client_secret = 9;
}
