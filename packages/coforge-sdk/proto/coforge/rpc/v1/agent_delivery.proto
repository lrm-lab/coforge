syntax = "proto3";

package coforge.rpc.v1;

import "coforge/rpc/v1/memory_hint.proto";

// Versioned server-to-daemon canonical direct message delivery.
message AgentMessageDelivery {
  uint32 protocol_major = 1;
  string request_id = 2;
  string message_id = 3;
  string workspace_id = 4;
  string conversation_id = 5;
  string agent_id = 6;
  string body = 7;
  string method = 8;
  string delivery_id = 9;
  uint64 sequence = 10;
  // Public target identity; never expose internal agent/user ids to Agents.
  string target = 11;
  // Closed vocabulary: "human", "agent", "system".
  string latest_sender_kind = 12;
  // Public handle without a leading "@"; required for "human"/"agent", empty for "system".
  string latest_sender_handle = 13;
  // The sender's role text; empty when there is none.
  string latest_sender_description = 14;
  // Present when the sender knows whether this delivery personally @mentioned the recipient Agent.
  optional bool mentions_agent = 15;
  // True when the recipient Agent is not a member of the channel and was notified of this one
  // message by the mention's sender; it can read the message but cannot reply in that channel.
  optional bool non_member_mention = 16;
  // Present when this delivery starts an isolated Task execution session.
  string task_execution_session_id = 17;
  // Present on a tracked @mention delivery: the daemon answers it with an ACK that echoes this
  // envelope once the mention is drained into that launch's session, or with a terminal error.
  MentionDeliveryEnvelope mention_delivery = 18;
  MemoryHintDelivery memory_hint = 19;
  // When the server created the message, in epoch milliseconds. Unset from a server that predates
  // it. Not when the daemon received it: a message replayed after a reconnect differs.
  optional uint64 created_at_ms = 20;
  // Whether task conversations are on in the Workspace as of this delivery. Unset from a server
  // that predates it: the daemon then keeps what its session was launched with.
  optional bool task_conversations = 21;
  // Why the delivery reached the Agent, on a target it was not automatically subscribed to:
  // "mentioned" (the message @-named it) or "subscribed" (it uploaded the attachment or commented
  // before). Unset on ordinary channel, DM and non-member-mention deliveries.
  optional string reason = 22;
  // Attachment count; unset from older servers.
  optional uint32 attachment_count = 23;
  // Source of non-person/non-Agent messages; unset on ordinary deliveries.
  optional string source = 24;
  // Documents on in the Workspace; unset from older servers.
  optional bool artifacts = 25;
  // Context view on in the Workspace; unset from older servers.
  optional bool agent_context_view = 26;
  // The message's own machine-readable notice kind (`system.kind`, e.g. "task.assigned_you");
  // unset on ordinary messages and from a server that predates it.
  optional string notice_kind = 27;
  // True when this delivery belongs to a Task's discussion, decided by the server from the Task
  // and its conversation, never from the target's shape; unset from a server that predates it.
  optional bool task_discussion = 28;
}

// The recipient Agent's launch and native session a tracked @mention delivery was issued for.
// The delivery it travels with (or a report's `delivery_id`) identifies the mention;
// `session_id` is the native session id the daemon reports in AgentSessionReport;
// `computer_id` is the Computer the envelope was issued to. This message never shipped, so its
// fields are numbered contiguously.
message MentionDeliveryEnvelope {
  string message_id = 1;
  string launch_id = 2;
  string session_id = 3;
  string computer_id = 4;
}

message AgentMessageDeliveryAck {
  uint32 protocol_major = 1;
  string request_id = 2;
  string delivery_id = 3;
  string message_id = 4;
  string workspace_id = 5;
  string agent_id = 6;
  uint64 sequence = 7;
  string method = 8;
  // The envelope of the tracked delivery this ACK drained, echoed unchanged.
  MentionDeliveryEnvelope mention_delivery = 9;
}

// Daemon-to-server progress of a tracked @mention delivery. `stage` is "daemon_received",
// "daemon_pending" or "daemon_drained"; `outcome` is "accepted" for a first sighting and
// "coalesced" for a repeat of a delivery still pending. Diagnostic only; never an ACK.
message AgentMentionDeliveryTransition {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string delivery_id = 5;
  string stage = 6;
  string outcome = 7;
  MentionDeliveryEnvelope mention_delivery = 8;
}

// Daemon-to-server final result of a tracked @mention delivery the daemon will not drain.
// `code` is an upper-case identifier such as "IDENTITY_UNKNOWN" or "QUOTA_LIMITED"; the server
// maps it to the recorded outcome.
message AgentMentionDeliveryTerminalError {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string delivery_id = 5;
  string code = 6;
  MentionDeliveryEnvelope mention_delivery = 7;
}

// Versioned daemon-to-server rejection of a delivery the daemon did not take custody of; it
// is never an acknowledgement. Closed vocabulary for `reason`: "no_process" (the Agent has no
// running process, no launch in progress, and nothing the daemon can relaunch it from).
message AgentMessageDeliveryRejection {
  uint32 protocol_major = 1;
  string request_id = 2;
  string delivery_id = 3;
  string message_id = 4;
  string workspace_id = 5;
  string agent_id = 6;
  uint64 sequence = 7;
  string method = 8;
  string reason = 9;
}
