syntax = "proto3";

package coforge.rpc.v1;

import "coforge/rpc/v1/computer.proto";
import "coforge/rpc/v1/runtime_auth.proto";

message DaemonRuntimeConfigureRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  reserved 4;
  reserved "connection_id";
  string workspace_root = 5;
  string daemon_api_key = 6;
  string computer_id = 7;
  string expected_server_url = 8;
  optional string server_http_url = 9;
}

message DaemonRuntimeConfigureResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  bool accepted = 3;
  // The configuration was taken, but the Workspace's start was still under way when the
  // Coordinator answered; it finishes behind the answer.
  optional bool lifecycle_under_way = 4;
}

message DaemonRuntimeReadyRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string worker_instance_id = 5;
  int64 started_at = 6;
  repeated string running_agent_ids = 7;
  string daemon_version = 8;
  repeated string recovered_restart_request_ids = 9;
  repeated string capabilities = 10;
  optional string computer_version = 11;
  optional string platform = 12;
  optional string os_version = 13;
  repeated string recovered_upgrade_request_ids = 14;
}

// The Workspace daemon's last word before it closes its connection on purpose: why it is going
// down. Best effort, never retried; a crash or a lost connection sends nothing. The server records
// the Computer event in each of the Computer's Agents' Activity. Additive: protocol_major stays 1.
message DaemonRuntimeShutdown {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  // The `worker_instance_id` this runtime reported in its ready.
  string worker_instance_id = 5;
  // "computer_upgrade", "computer_restart", or "computer_stop" (DAEMON_SHUTDOWN_REASONS).
  string reason = 6;
}

message ComputerRestartIntent {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string message_type = 5;
}

message ComputerUpgradeIntent {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string target = 5;
  string message_type = 6;
  optional string expected_version = 7;
}

// The Daemon's terminal report for one Computer upgrade operation. The server still requires its
// own identity evidence before calling a reported success complete; a reported failure is
// authoritative because only the Computer can observe it.
message ComputerUpgradeResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string status = 5;
  int64 completed_at_ms = 6;
  string message_type = 7;
  optional string version = 8;
  optional string error = 9;
  // Stable machine-readable reason, carried from wherever this failure actually happened
  // (Coordinator refusal, or the upgrade job's own receipt). Additive: an older peer that has
  // never heard of a value here still has `error`, the human sentence. See UPGRADE_ERROR_CODE.
  optional string error_code = 10;
}

message DaemonRuntimeCodeAgentsUpdateRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  repeated RuntimeMetadata runtimes = 5;
  repeated CodeAgentModelCatalog catalogs = 6;
}

message DaemonRuntimeUsageScanRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string provider = 5;
  string message_type = 6;
}

message DaemonRuntimeUsageScanResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string provider = 5;
  bool accepted = 6;
  string status = 7;
  string message = 8;
  bytes snapshot_json = 9;
  string message_type = 10;
}

// Server -> daemon, on the daemon control channel like `DaemonRuntimeUsageScanRequest`: re-run
// Code Agent model-catalog discovery now, so the browser's model selector can pick up a provider
// config change without a daemon restart. The daemon re-reports through the ordinary
// `DaemonRuntimeCodeAgentsUpdateRequest` path and answers here with the fresh catalog.
message DaemonRuntimeProviderModelRefreshRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string message_type = 5;
}

// Daemon -> server RPC, method `daemon:v1:provider:model_refresh_result`. `catalogs` carries the
// freshly discovered catalog only when `status` is `refreshed`; `status` is one of
// `refreshed | refused | error`.
message DaemonRuntimeProviderModelRefreshResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  bool accepted = 5;
  string status = 6;
  string message = 7;
  repeated CodeAgentModelCatalog catalogs = 8;
  string message_type = 9;
}

// Server -> daemon, on the daemon control channel: read one Command Code model's effort choices.
// Catalog discovery does not carry them. `model_id` is the model the user just selected.
message DaemonRuntimeCommandCodeEffortReadRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string model_id = 5;
  string message_type = 6;
}

// Daemon -> server RPC, method daemon:v1:provider:effort_read_result. `status` is `ready` or
// `failed`. `efforts` omits the CLI's `default` (that choice is an empty string on the form).
// An empty `efforts` list with `ready` means the model has no effort control. `failed` does not.
message DaemonRuntimeCommandCodeEffortReadResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  bool accepted = 5;
  string status = 6;
  repeated string efforts = 7;
  string message_type = 8;
}

message CodeAgentModelCatalog {
  string provider = 1;
  repeated CodeAgentModelMetadata models = 2;
}

message CodeAgentModelMetadata {
  string id = 1;
  string display_name = 2;
  string description = 3;
  string model_provider = 4;
  repeated string reasoning_efforts = 5;
  string default_reasoning = 6;
  bool recommended = 7;
  // Fast support is decided by runtime, not per model; an older daemon may still send this field.
  reserved 8;
  reserved "supports_fast_mode";
}

// Daemon -> server notice, method `daemon:v1:runtime_auth:status_report`: the login status of
// every runtime with a login flow on this Computer, collected together and sanitized on the
// Computer (an account label only ever leaves it masked). Sent when the daemon is ready, when the
// runtime inventory changes, after a login or logout, and when a usage scan asks to sign in again;
// never on a timer. The server sanitizes again and keeps the newest report per Computer. Additive:
// protocol_major stays 1, and an older server refuses the method, which the daemon ignores.
message RuntimeAuthStatusReport {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  int64 collected_at_ms = 5;
  repeated RuntimeAuthState runtimes = 6;
}

enum RuntimeAuthStateKind {
  RUNTIME_AUTH_STATE_KIND_UNSPECIFIED = 0;
  RUNTIME_AUTH_STATE_KIND_LOGGED_IN = 1;
  RUNTIME_AUTH_STATE_KIND_LOGGED_OUT = 2;
  RUNTIME_AUTH_STATE_KIND_UNKNOWN = 3;
  RUNTIME_AUTH_STATE_KIND_UNAVAILABLE = 4;
}

enum RuntimeAuthUnavailableReason {
  RUNTIME_AUTH_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  RUNTIME_AUTH_UNAVAILABLE_REASON_NOT_INSTALLED = 1;
  RUNTIME_AUTH_UNAVAILABLE_REASON_VERSION_UNSUPPORTED = 2;
  RUNTIME_AUTH_UNAVAILABLE_REASON_UNSUPPORTED_INSTALLATION = 3;
}

// One runtime's login status. The account comes only with LOGGED_IN, and a reason only with
// UNAVAILABLE; a state the receiver does not know reads as UNKNOWN.
message RuntimeAuthState {
  // A runtime provider id, as in RuntimeMetadata (`claude-code`, `codex`).
  string provider = 1;
  RuntimeAuthStateKind state = 2;
  // The signed-in account, as the login report carries it: the label is masked.
  optional RuntimeAuthAccount account = 3;
  RuntimeAuthUnavailableReason unavailable_reason = 4;
}
