syntax = "proto3";

package coforge.rpc.v1;

// Daemon-to-server report that an Agent's provider credential works again after the Agent showed it
// unusable (a runtime_error Activity needing a person's action, or an exhausted balance). `reason`
// is what the Agent showed ("user_reauth", "user_model_access" or "BillingError"); `release_cause`
// is what ended it ("credentials_changed", "explicit_stop", "model_changed" or "model_output");
// `launch_id` is the Agent's running launch, when it has one; `restored_at_ms` is when the daemon
// found the credential usable again, on the clock of the Agent's own Activities. Best-effort and
// diagnostic: the server only stops showing the failure.
message AgentCredentialRestored {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string reason = 5;
  string release_cause = 6;
  string launch_id = 7;
  uint64 restored_at_ms = 8;
}
