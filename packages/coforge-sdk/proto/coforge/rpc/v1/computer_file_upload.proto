syntax = "proto3";

package coforge.rpc.v1;

// Owner-authorized request for the Computer to pull one object into its uploads directory.
message ComputerFilePullRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string message_type = 5;
  // Short-lived HTTPS URL the Computer fetches outbound (presigned GET).
  string download_url = 6;
  string file_name = 7;
  uint64 size_bytes = 8;
  string content_type = 9;
}

message ComputerFilePullResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string message_type = 5;
  // Echoes the request so the cloud can match the pending pull without a side channel.
  string download_url = 6;
  string file_name = 7;
  uint64 size_bytes = 8;
  string content_type = 9;
  // "ok", "error", "too_large", "unavailable".
  string status = 10;
  // Absolute path under the Computer's uploads directory when status is "ok".
  string path = 11;
  string error_message = 12;
}
