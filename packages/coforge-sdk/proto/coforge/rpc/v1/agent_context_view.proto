syntax = "proto3";

package coforge.rpc.v1;

message AgentContextViewRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string message_id = 6;
  string session_id = 7;
  string message_type = 8;
}

message AgentContextViewResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string message_id = 6;
  string session_id = 7;
  string message_type = 8;
  string status = 9;
  string reason = 10;
  string provider = 11;
  uint64 created_at_ms = 12;
  bytes content = 13;
  string encoding = 14;
}
