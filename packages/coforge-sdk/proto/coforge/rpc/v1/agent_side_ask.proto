syntax = "proto3";

package coforge.rpc.v1;

message AgentSideAskAsker {
  string user_id = 1;
  string display_name = 2;
  string role = 3;
  bool is_agent_owner = 4;
}

message AgentSideAskRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string kind = 6;
  string question = 7;
  uint32 timeout_ms = 8;
  optional AgentSideAskAsker asker = 9;
  string message_type = 10;
}

message AgentSideAskResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string asker_user_id = 6;
  string kind = 7;
  string status = 8;
  string reason = 9;
  string answer = 10;
  string runtime = 11;
  uint32 duration_ms = 12;
  string message_type = 13;
}
